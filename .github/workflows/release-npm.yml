# Manual backup for scripts/release.sh (the normal, local release path).
# Actions → Release npm package → Run workflow, then pick the package.
# Requires secret NPM_TOKEN (automation token).
name: Release npm package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options: [vue, react]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - id: pkg
        run: echo "ws=${{ inputs.package }}-diff-text" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test -w ${{ steps.pkg.outputs.ws }}
      - run: npm run build -w ${{ steps.pkg.outputs.ws }}
      - run: npm publish -w ${{ steps.pkg.outputs.ws }} --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
