# Manual backup for scripts/release.sh, which normally does the split locally.
# Mirrors packages/php into sitefinitysteve/php-diff-text (which Packagist reads);
# give a tag (vX.Y.Z) to also tag the mirror.
# Requires secret SPLIT_TOKEN: a fine-grained PAT with contents:write on php-diff-text.
name: Split PHP package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create on the mirror (e.g. v1.6.0); leave empty for no tag
        required: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
      - uses: danharrin/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: packages/php
          repository_organization: sitefinitysteve
          repository_name: php-diff-text
          branch: main
          tag: ${{ steps.tag.outputs.tag }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
