# Deploys the live demos to https://sitefinitysteve.github.io/diff-text/.
# Run by scripts/release.sh --go, or by hand: gh workflow run pages.yml --ref main
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Demo site
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
      - run: npm ci
      - run: (cd packages/vue/demo && npm ci) && (cd packages/react/demo && npm ci)
      - run: scripts/build-pages.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
